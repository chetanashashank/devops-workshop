name: Build, Test, Deploy

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the website
        working-directory: labs/capstone
        run: bash build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: labs/capstone/build/site/

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: labs/capstone/build/site/
      - name: Test the website
        working-directory: labs/capstone
        run: bash test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: tested-website
          path: labs/capstone/build/site/

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tested-website
          path: labs/capstone/build/site/
      - name: Deploy the website
        working-directory: labs/capstone
        run: bash deploy.sh
      - name: Show deployed file
        working-directory: labs/capstone
        run: ls -l deployed/index.html
